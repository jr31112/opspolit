services:
  mysql:
    image: mysql:8.0
    container_name: opspilot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}  
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "opspilot", "-popspilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: opspilot-app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/opspilot
      SPRING_DATASOURCE_USERNAME: opspilot
      SPRING_DATASOURCE_PASSWORD: opspilot